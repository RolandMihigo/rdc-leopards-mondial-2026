<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RD Congo - Mondial 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="title">Les Léopards - Coupe du Monde 2026</h1>
    <main>
      <div class="team-stats">
        <p>Equipe: <span id="team"></span></p>
        <p>Année: <span id="year"></span></p>
        <p>coach: <span id="head-coach"></span></p>
      </div>
      <label class="options-label" for="players">Filtrer par poste :</label>
      <select name="players" id="players">
        <option value="all">Tous les joueurs</option>
        <option value="attaquant">Attaquant</option>
        <option value="milieu">Milieu de terrain</option>
        <option value="defenseur">Défenseur</option>
        <option value="gardien">Gardien de but</option>
      </select>
      <div class="cards" id="player-cards"></div>
    </main>
    <footer>&copy; Roland Iragi</footer>
    <script src="./script.js"></script>
  </body>
</html>
